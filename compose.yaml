name: goms
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: goms
      POSTGRES_DB: goms
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U goms -d goms']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 1g
  migrate:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    image: goms-api:local
    command: [migrate]
    healthcheck: {disable: true}
    environment: {NODE_ENV: development}
    secrets: [postgres_password]
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 512m
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    image: goms-api:local
    environment:
      NODE_ENV: development
      PORT: '8080'
      AUTH_PROVIDER: ${AUTH_PROVIDER:-firebase}
      AUTH_ENFORCEMENT_ENABLED: 'true'
      READ_AUTH_ENFORCEMENT_ENABLED: 'true'
      RBAC_MODE: ${RBAC_MODE:-enforce}
      FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      ADMIN_ALLOWED_EMAILS: ${ADMIN_ALLOWED_EMAILS:-}
      ADMIN_IMPORT_ALLOWED_EMAILS: ${ADMIN_IMPORT_ALLOWED_EMAILS:-}
      CORS_ALLOWED_ORIGINS: ${GOMS_ORIGIN:-http://localhost:8088}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOMS_ORIGIN:-http://localhost:8088}/api/oauth/google/callback
      OAUTH_WEB_ORIGIN: ${GOMS_ORIGIN:-http://localhost:8088}
      ATTACHMENTS_BUCKET: ${ATTACHMENTS_BUCKET:-}
    secrets: [postgres_password, api_config, google_credentials]
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    init: true
    mem_limit: 1g
  web:
    image: goms-web:local
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: ${GOMS_ORIGIN:-http://localhost:8088}
        VITE_AUTH_PROVIDER: ${AUTH_PROVIDER:-firebase}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    ports: ['127.0.0.1:${GOMS_PORT:-8088}:8080']
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 256m
  seed:
    profiles: [tools]
    build: {context: ., dockerfile: docker/seed.Dockerfile}
    command: [seed]
    environment: {NODE_ENV: development}
    secrets: [postgres_password]
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    mem_limit: 2g
volumes:
  postgres_data:
secrets:
  postgres_password: {file: .docker/secrets/postgres_password}
  api_config: {file: .docker/secrets/api.json}
  google_credentials: {file: .docker/secrets/google_credentials.json}
