services:
  api:
    environment:
      ONLYOFFICE_URL: ${ONLYOFFICE_URL:-http://localhost:8082}
      ONLYOFFICE_INTERNAL_API_URL: http://api:8080
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
    secrets: [postgres_password, api_config, google_credentials, onlyoffice_jwt]
  onlyoffice:
    image: onlyoffice/documentserver:9.0.0
    ports: ['127.0.0.1:8082:80']
    environment:
      JWT_ENABLED: 'true'
      ALLOW_PRIVATE_IP_ADDRESS: 'true'
    secrets: [onlyoffice_jwt]
    entrypoint: [/bin/bash, -c]
    command: ['export JWT_SECRET="$$(cat /run/secrets/onlyoffice_jwt)"; exec /app/ds/run-document-server.sh']
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_library:/var/lib/onlyoffice
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost/healthcheck | grep -q true']
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 10
    restart: unless-stopped
    mem_limit: 4g
    shm_size: 256m
secrets:
  onlyoffice_jwt: {file: .docker/secrets/onlyoffice_jwt}
volumes:
  onlyoffice_data:
  onlyoffice_library:
