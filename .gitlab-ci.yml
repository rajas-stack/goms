image: node:20

variables:
  NODE_OPTIONS: "--max-old-space-size=8192"

pages:
  stage: deploy

  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - rm -rf public
    - mv dist public

  artifacts:
    paths:
      - public
    expire_in: 1 hour

  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"