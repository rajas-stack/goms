image: node:20

variables:
  # The real OOM cause was Rollup's module graph holding one chunk per
  # lazy-loaded geo asset file (village-shapes + villages globs, ~12,800
  # files combined) — chunk-graph overhead, not JSON payload size, so this
  # heap bump alone never fully fixed it (it recurred as more geo files were
  # added). vite.config.ts now buckets those globs into ~40 chunks each via
  # manualChunks, which is the actual fix. Left at 8192 as headroom.
  NODE_OPTIONS: "--max-old-space-size=8192"

pages:
  stage: deploy

  # Left at 2h as headroom; the manualChunks fix (see NODE_OPTIONS comment)
  # brought the local build back down to ~6-8 min.
  timeout: 2h

  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - rm -rf public
    - mv dist public

  artifacts:
    paths:
      - public
    expire_in: 1 hour

  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"