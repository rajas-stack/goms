apply plugin: 'com.android.application'

// --- Release signing (internal/sideload distribution) -----------------------
// Reads keystore location/passwords from Gradle properties, never from
// hardcoded literals in this file. Properties can come from either:
//   1. android/keystore.properties (git-ignored local file), or
//   2. -P/gradle.properties/environment-style Gradle project properties
//      (e.g. `ORG_GRADLE_PROJECT_MYAPP_RELEASE_STORE_PASSWORD=...`).
// See android/README.md for full setup instructions.
//
// If the properties are absent, `signingProps` stays empty and the
// `release` build type below falls back to the default (unsigned) signing
// config, so `assembleRelease` still succeeds for anyone who hasn't set up
// signing — it just won't be installable until it's signed some other way.
def signingProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { signingProps.load(it) }
}

def signingPropOrEnv = { String propName, String envName ->
    if (signingProps.containsKey(propName)) return signingProps[propName]
    if (project.hasProperty(propName)) return project.property(propName)
    def envVal = System.getenv(envName)
    if (envVal != null) return envVal
    return null
}

def releaseStoreFile = signingPropOrEnv('MYAPP_RELEASE_STORE_FILE', 'MYAPP_RELEASE_STORE_FILE')
def releaseStorePassword = signingPropOrEnv('MYAPP_RELEASE_STORE_PASSWORD', 'MYAPP_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = signingPropOrEnv('MYAPP_RELEASE_KEY_ALIAS', 'MYAPP_RELEASE_KEY_ALIAS')
def releaseKeyPassword = signingPropOrEnv('MYAPP_RELEASE_KEY_PASSWORD', 'MYAPP_RELEASE_KEY_PASSWORD')

def hasReleaseSigningConfig = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
// ------------------------------------------------------------------------

android {
    namespace = "com.gorms.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.gorms.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigningConfig) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            // Falls back to the default (unsigned) signing when the
            // properties above aren't set, so this build type never
            // hard-fails just because signing hasn't been configured yet.
            signingConfig hasReleaseSigningConfig ? signingConfigs.release : null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
