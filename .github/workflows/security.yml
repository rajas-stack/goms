name: Security checks
on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/security-check.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build --workspace @goms/api
      - run: npx vitest run src/security/security.test.ts src/security/audit.test.ts src/auth/identity.test.ts src/auth/rbac/registry/completeness.test.ts src/routers/tenderWebsites.test.ts src/routers/googleIntegrations.test.ts
        working-directory: apps/api
      - run: npx vitest run src/features/dms/googleDrive.test.ts src/features/integrations/googleClient.test.ts src/features/integrations/workspaceClient.test.ts src/features/tender-websites/credentialLock.test.ts src/lib/csv.test.ts
      - run: npx vitest run --config vitest.component.config.ts src/features/integrations/IntegrationsSettingsPage.test.tsx src/features/integrations/GoogleAccountBinder.test.tsx src/lib/permissions.security.test.tsx src/lib/permissions.test.tsx
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --pull -f apps/api/Dockerfile -t goms-security .
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: goms-security
          severity: HIGH,CRITICAL
          exit-code: '1'
          scanners: vuln,secret
